<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sub-Emotion Music Player</title>
    <style>
        body { text-align: center; background: #222; color: white; font-family: Arial; }
        img { border: 3px solid #00ffcc; border-radius: 10px; margin-top: 20px; }
        button { margin: 10px; padding: 10px 20px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .btn-skip { background: #f39c12; }
        .btn-next { background: #2980b9; color: white; }
        .btn-stop { background: #e74c3c; color: white; }
        .queue { margin-top: 20px; }
        .queue h3 { margin-bottom: 5px; }
        .song { margin: 2px 0; }
    </style>
</head>
<body>
    <h1>🎶 Sub-Emotion Music Player</h1>
    <img src="{{ url_for('video_feed') }}" width="640" height="480">

    <div>
        <button class="btn-skip" onclick="control('skip_song')">⏭ Skip Emotion</button>
        <button class="btn-next" onclick="control('next_song')">▶ Next Song</button>
        <button class="btn-stop" onclick="control('stop_song')">⏹ Stop</button>
    </div>

    <div class="queue">
        <h3>Previous Songs:</h3>
        <div id="prev_songs">
            {% for song in prev_songs %}
                <div class="song">{{ song['song'] }} - {{ song['emotion'] }}</div>
            {% endfor %}
        </div>

        <h3>Upcoming Sub-Emotions Queue:</h3>
        <div id="queue">
            {% for sub_emotion in queue %}
                <div class="song">{{ sub_emotion }}</div>
            {% endfor %}
        </div>
    </div>

    <script>
        function control(action) {
            fetch('/' + action, {method: 'POST'})
                .then(res => res.json())
                .then(data => {
                    let prevDiv = document.getElementById("prev_songs");
                    let queueDiv = document.getElementById("queue");
                    prevDiv.innerHTML = "";
                    queueDiv.innerHTML = "";

                    data.prev_songs.forEach(s => {
                        let div = document.createElement("div");
                        div.className = "song";
                        div.innerText = s.song + " - " + s.emotion;
                        prevDiv.appendChild(div);
                    });

                    data.queue.forEach(e => {
                        let div = document.createElement("div");
                        div.className = "song";
                        div.innerText = e;
                        queueDiv.appendChild(div);
                    });
                });
        }
    </script>
</body>
</html>
